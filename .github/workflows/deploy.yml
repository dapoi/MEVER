name: Build & Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — SETUP
  # Determine matrix (tracks & version names)
  # and whether to upload to Play Store
  # ─────────────────────────────────────────────
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    if: github.actor == 'dapoi'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      upload_play_store: ${{ steps.set-matrix.outputs.upload_play_store }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Matrix
        id: set-matrix
        run: |
          git fetch --tags --force
          TAG_NAME="${{ github.ref_name }}"
          TAG_MESSAGE=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG_NAME")

          if [[ "$TAG_MESSAGE" == *"upload_play_store=false"* ]]; then
            echo "upload_play_store=false" >> $GITHUB_OUTPUT
          else
            echo "upload_play_store=true" >> $GITHUB_OUTPUT
          fi

          if [[ "$TAG_NAME" == *"-internal"* ]]; then
            VER_NAME="${TAG_NAME#v}"
            MATRIX_JSON="[{\"track\":\"internal\",\"version_name\":\"$VER_NAME\"}]"
          elif [[ "$TAG_NAME" == *"-beta"* ]]; then
            VER_NAME="${TAG_NAME#v}"
            MATRIX_JSON="[{\"track\":\"beta\",\"version_name\":\"$VER_NAME\"}]"
          elif [[ "$TAG_MESSAGE" == *"dual=true"* ]] || [[ "$TAG_MESSAGE" == *"Production & Beta"* ]]; then
            CLEAN_VER="${TAG_NAME#v}"
            BETA_VER="${CLEAN_VER}-beta01"
            MATRIX_JSON="[{\"track\":\"beta\",\"version_name\":\"$BETA_VER\"},{\"track\":\"production\",\"version_name\":\"$CLEAN_VER\"}]"
          else
            CLEAN_VER="${TAG_NAME#v}"
            MATRIX_JSON="[{\"track\":\"production\",\"version_name\":\"$CLEAN_VER\"}]"
          fi

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────
  # JOB 2 — BUILD (parallel per track)
  # Runs simultaneously for beta & production
  # Uploads AAB as artifact for the deploy job
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Build (${{ matrix.track }})
    needs: setup
    if: needs.setup.outputs.upload_play_store == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up env.properties
        run: |
          echo "ADMOB_ID=${{ secrets.ADMOB_ID }}" >> env.properties
          echo "AD_BANNER_UNIT_ID=${{ secrets.AD_BANNER_UNIT_ID }}" >> env.properties
          echo "AD_INTERSTITIAL_UNIT_ID=${{ secrets.AD_INTERSTITIAL_UNIT_ID }}" >> env.properties
          echo "API_KEY_DEBUG=${{ secrets.API_KEY_DEBUG }}" >> env.properties
          echo "BASE_URL_DEBUG=${{ secrets.BASE_URL_DEBUG }}" >> env.properties
          echo "BASE_URL_RELEASE=${{ secrets.BASE_URL_RELEASE }}" >> env.properties
          echo "REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}" >> env.properties

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

      - name: Build Release AAB (${{ matrix.track }})
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BASE_VERSION_CODE=$((20260701 + ${{ github.run_number }} * 10))
          if [[ "${{ matrix.track }}" == "production" ]]; then
            VERSION_CODE=$((BASE_VERSION_CODE + 1))
          else
            VERSION_CODE=$BASE_VERSION_CODE
          fi
          echo "Building ${{ matrix.track }} version ${{ matrix.version_name }} ($VERSION_CODE)"

          ./gradlew bundleRelease \
            -PversionName="${{ matrix.version_name }}" \
            -PversionCode="$VERSION_CODE"

      - name: Save AAB artifact (${{ matrix.track }})
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.track }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — DEPLOY (sequential per track)
  # Waits for ALL builds to finish, then uploads
  # one at a time to avoid Play Store edit conflict
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy (${{ matrix.track }})
    needs: [setup, build]
    if: needs.setup.outputs.upload_play_store == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AAB artifact (${{ matrix.track }})
        uses: actions/download-artifact@v4
        with:
          name: aab-${{ matrix.track }}
          path: app/build/outputs/

      - name: Upload to Play Store (${{ matrix.track }})
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.dapascript.mever
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ matrix.track }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
