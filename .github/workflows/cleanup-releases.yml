name: Cleanup Old Releases & Tags

on:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete Old Releases and Tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force

          echo "🔍 Finding tags to keep..."

          # Keep latest stable tag, latest beta tag, and latest internal tag
          STABLE_TAG=$(git tag -l "v*" | grep -v "\-internal" | grep -v "\-beta" | sort -V | tail -n 1)
          BETA_TAG=$(git tag -l "v*-beta*" | sort -V | tail -n 1)
          INTERNAL_TAG=$(git tag -l "v*-internal*" | sort -V | tail -n 1)

          echo "✅ Keeping Latest Stable:   ${STABLE_TAG:-none}"
          echo "✅ Keeping Latest Beta:     ${BETA_TAG:-none}"
          echo "✅ Keeping Latest Internal: ${INTERNAL_TAG:-none}"
          echo "---------------------------------------"

          ALL_TAGS=$(git tag -l "v*")

          for tag in $ALL_TAGS; do
            if [ "$tag" != "$STABLE_TAG" ] && [ "$tag" != "$BETA_TAG" ] && [ "$tag" != "$INTERNAL_TAG" ]; then
              echo "🗑️ Deleting release & tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
              git push origin --delete "$tag" 2>/dev/null || true
            else
              echo "✨ Keeping: $tag"
            fi
          done

          echo "---------------------------------------"
          echo "🎉 Cleanup finished!"
