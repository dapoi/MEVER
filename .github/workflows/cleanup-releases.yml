name: Cleanup Old Releases

on:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete Old Releases and Tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Searching for latest releases..."
          
          # Get latest stable tag
          STABLE=$(gh release list --exclude-pre-releases --limit 1 | awk '{print $1}')
          
          # Get latest pre-release tag using jq
          PRE=$(gh release list --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName' | head -n 1)
          
          echo "✅ Latest Stable: $STABLE"
          echo "✅ Latest Pre-release: $PRE"
          echo "---------------------------------------"

          # Get all releases (limit 100)
          RELEASES=$(gh release list --limit 100 --json tagName --jq '.[] | .tagName')

          for tag in $RELEASES; do
            if [ "$tag" != "$STABLE" ] && [ "$tag" != "$PRE" ]; then
              echo "🗑️ Deleting release and tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag
            else
              echo "✨ Keeping: $tag"
            fi
          done
          
          echo "---------------------------------------"
          echo "🎉 Finished! Kept $STABLE and $PRE."
